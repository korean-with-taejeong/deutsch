<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE: a calm late-night practice room; a coach who marks up your script
   IDEA: a speaking score: the speech written out like sheet music (stress, breath, melody)
   PICTURE: the annotated paragraph itself, large and tappable, lighting up as the model voice plays
   COLOUR and TYPE: warm paper ground, orange for stress, calm blue for melody and breath, brown for sounds (IPA); Atkinson Hyperlegible Next for German, IBM Plex Sans KR for Korean
   LAYOUT: one 680px column, sticky header with a 4-step bar, fixed bottom action
   Data comes from sets/<id>.json via tools/build.py; recording, comparing and saving work like the Korean app. */
:root{color-scheme:light;--z:1;--bg:#FAF7F2;--bg2:#F2ECE3;--card:#FFFFFF;--line:#E6DCCF;--ink:#2B2420;--hi:#1C1713;--mut:#6B5F56;--dim:#998C81;--y:#F28C28;--yi:#2B1700;--at:#B4560F;--lav:#4F7CAC;--teal:#8B5E3C;--cta:#2B2420;--ctai:#FAF7F2;--now:rgba(242,140,40,.17);--hit:rgba(79,124,172,.2);--red:#D9473A}
:root[data-look=night]{color-scheme:dark;--bg:#1F1A16;--bg2:#2A231E;--card:#28211C;--line:#3D342C;--ink:#F1EAE0;--hi:#FFF8EF;--mut:#C0B3A6;--dim:#8F8277;--y:#F5A04A;--yi:#2B1700;--at:#F5A04A;--lav:#8DB0DB;--teal:#D2A27A;--cta:#F1EAE0;--ctai:#1F1A16;--now:rgba(245,160,74,.18);--hit:rgba(141,176,219,.26);--red:#EF6B5E}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,label:focus-within,[tabindex]:focus-visible{outline:2px solid var(--y);outline-offset:3px}
svg{display:block}
a{color:inherit}
.ann,.ch .tx,.de,.pd,.legend .st{font-family:"Atkinson Hyperlegible Next","Atkinson Hyperlegible","IBM Plex Sans KR",-apple-system,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 20px calc(124px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 84%,transparent);padding:calc(8px + env(safe-area-inset-top)) 20px 8px;max-width:680px;margin:0 auto}
@media (max-width:420px){header.top{padding-left:12px;padding-right:12px}}
.hrow{display:flex;align-items:center;gap:12px;min-height:64px}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.icon svg{width:24px;height:24px}
.ht{flex:1}
.az{font-size:19px;font-weight:700;position:relative}.az i{position:absolute;right:5px;top:7px;font-style:normal;font-size:11px;color:var(--at)}
.ov{font-size:12.5px;font-weight:700;color:var(--at)}
.tt{font-size:20px;font-weight:700;color:var(--hi);line-height:1.25}
.sb{font-size:13px;color:var(--mut)}
.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}

.bar i.d{background:var(--y)}.bar i.c{background:var(--ink)}
.blab{font-size:13px;margin-top:10px}
.kick{font-size:14px;font-weight:700;color:var(--mut);margin:22px 0 10px}
h1{font-size:clamp(28px,6.4vw,36px);line-height:1.15;margin:0 0 10px;color:var(--hi);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.lead{color:var(--mut);margin:0 0 18px;font-size:calc(16.5px*var(--z))}
.pills{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.pl{font-size:14px;color:var(--mut);margin-right:-2px}
.pill{min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;display:inline-flex;align-items:center;gap:9px;font-size:15px}

.x{display:none!important}.on .x{display:inline-flex!important}.on .o{display:none!important}

.pill.on{border-color:var(--y);color:var(--at)}

.w.has{cursor:pointer}
.pr{display:none;position:absolute;left:50%;bottom:calc(100% + .06em);transform:translateX(-50%);font:600 .5em/1 "Charis SIL","Doulos SIL","Gentium Plus","Noto Sans","Segoe UI",-apple-system,system-ui,sans-serif;color:var(--teal);white-space:nowrap;letter-spacing:0;cursor:pointer}
.ipa .pr{display:block}
.w.hit{background:var(--hit);border-radius:5px;box-shadow:0 0 0 3px var(--hit)}

.tr{color:var(--mut);font-size:calc(16px*var(--z));line-height:1.75;margin:0 0 24px}
.card{border:1.5px solid var(--line);border-radius:22px;padding:18px 20px;margin:0 0 16px}
.mh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px}
.mh b{color:var(--at)}.mh span{color:var(--dim);font-size:13px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.cnt{font-weight:700;font-variant-numeric:tabular-nums}
.circ{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.circ svg{width:20px;height:20px}

.circ.sm{width:46px;height:46px}.circ.sm svg{width:15px;height:15px}

.mi{display:flex;gap:14px;align-items:flex-start;min-height:64px}
.mi p{margin:0;font-size:calc(16.5px*var(--z));line-height:1.65}
.mi b{color:var(--hi);margin-right:4px}
.mi .ipa1{color:var(--teal);font-weight:600;margin-right:6px;font-family:"Charis SIL","Doulos SIL","Noto Sans",-apple-system,system-ui,sans-serif}
.tag{flex:none;font-weight:700;font-size:15px;padding-top:1px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.k0{color:var(--at)}.k1,.k2{color:var(--lav)}.k3{color:var(--teal)}
.minis{display:flex;flex-wrap:wrap;gap:4px 18px}
.mini{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--mut);min-height:40px;margin-top:4px}
.mini svg{width:11px;height:11px}
.mini.on{color:var(--at)}
.why{background:var(--bg2);border-radius:22px;padding:18px 20px;margin:0 0 26px}
.why h3,.sec{font-size:15px;color:var(--at);margin:0 0 10px;font-weight:700}
.sec{margin:28px 0 12px;color:var(--mut)}
.why p{margin:0 0 9px;font-size:calc(16px*var(--z));line-height:1.6}.why p:last-child{margin:0}
.why b{color:var(--hi);font-weight:600}
.id{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 16px 18px;border:1.5px solid var(--line);border-radius:18px;margin-bottom:10px}
.ib{flex:1}
.ih{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.de{font-weight:700;color:var(--hi);font-size:calc(18px*var(--z));margin-right:2px}
.tg,.rg{font-size:11.5px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:0 8px;line-height:19px;white-space:nowrap}
.tg{color:var(--lav)}.rg{color:var(--teal)}
.ko2{margin-top:4px;font-size:calc(16px*var(--z))}
.li,.nt{font-size:calc(14.5px*var(--z));color:var(--mut);margin-top:3px;line-height:1.55}
.li{color:var(--dim)}
.tip{font-size:calc(14.5px*var(--z));color:var(--dim);margin:-6px 0 18px}
.ch{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px 14px 16px 20px;margin-bottom:12px;cursor:pointer;position:relative}
.ch .tx{flex:1;font-size:calc(clamp(19px,4.6vw,22px)*var(--z));line-height:1.65}
.ipa .ch .tx{line-height:2.45}
.rb{width:56px;height:56px;border-radius:50%;background:var(--cta);color:var(--ctai);display:grid;place-items:center;flex:none}
.rb svg{width:22px;height:22px}
.ch.on{border-color:var(--y)}.ch.on .rb{background:var(--y);color:var(--yi)}
.yt{display:none;position:absolute;top:-11px;right:18px;background:var(--y);color:var(--yi);font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.ch.turn .yt{display:block}
.rec{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin:0 0 16px}
.rec .lab{font-size:14px;color:var(--mut);margin:0 0 12px}
.micwhy{display:flex;gap:8px;align-items:flex-start;font-size:calc(14px*var(--z));color:var(--mut);margin:0 0 12px}
.micwhy svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--at)}
.ybtn,.obtn{width:100%;min-height:62px;border-radius:16px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;cursor:pointer;text-decoration:none}
.ybtn{background:var(--y);color:var(--yi)}
.obtn{border:1.5px solid var(--line);font-size:16px;min-height:54px}
.ybtn svg,.obtn svg{width:22px;height:22px}
.acts .ybtn{font-size:16px;min-height:54px}
.ybtn.recing{background:var(--red);color:#fff}
.ybtn.recing::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.recmsg{font-size:calc(14.5px*var(--z));line-height:1.6;color:var(--red);margin:12px 2px 0}
.recmsg.info{color:var(--mut)}
.hint{font-size:calc(14px*var(--z));color:var(--dim);margin:12px 2px 0;line-height:1.55}
.lab2{font-size:14px;color:var(--mut);margin:0 0 8px}
.mine{margin:0 0 18px}
.mine audio{width:100%;display:block}
.cmp{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.cmp .sn{font-weight:500}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px}
.sendmsg:empty{display:none}
.sendmsg{margin-top:10px}
.ipadmsg{background:var(--bg2);border-radius:16px;padding:14px 16px;font-size:calc(14.5px*var(--z));line-height:1.6}
.ipadmsg b{color:var(--hi)}.ipadmsg ol{margin:6px 0 8px;padding-left:20px}.ipadmsg p{margin:0 0 4px;color:var(--mut)}.ipadmsg .fn{word-break:break-all;color:var(--at);font-weight:600}
.retry{font-size:13.5px;color:var(--mut);text-decoration:underline;min-height:40px;font-weight:700}
.fname{font-size:12.5px;color:var(--dim);margin-top:8px;word-break:break-all}
.empty{font-size:14.5px;color:var(--mut);padding:10px 2px;margin:0}
.ck{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1.5px solid var(--line);border-radius:18px;margin-bottom:10px;cursor:pointer;font-size:calc(16px*var(--z));line-height:1.55}
.ck input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:8px;background:var(--card);border:1.5px solid var(--line);flex:none;margin:0;display:grid;place-items:center;cursor:pointer}
.ck input:checked{background:var(--y);border-color:var(--y)}
.ck input:checked::after{content:"";width:7px;height:13px;border:solid var(--yi);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.ck.c{border-color:var(--y)}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
.cta>div{max-width:680px;margin:0 auto;display:flex;gap:14px}
.back{width:76px;height:62px;border:1.5px solid var(--line);border-radius:18px;display:grid;place-items:center;flex:none}

.stat{display:flex;gap:16px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px 18px;margin:6px 0 4px}
.dd{font-size:30px;font-weight:700;color:var(--at);font-variant-numeric:tabular-nums;white-space:nowrap}
.sx{flex:1}.sx b{font-size:15px}
.sbar{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px;margin-top:8px}
.sbar i{height:6px;border-radius:3px;background:var(--line)}.sbar i.d{background:var(--y)}
.pc{display:flex;gap:16px;align-items:center;padding:16px 18px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;margin-bottom:12px;width:100%;text-align:left}
.pc.nx{border-color:var(--y)}
.lt{width:48px;height:48px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--at);flex:none}
.lt svg{width:22px;height:22px}
.pc.done .lt{background:var(--y);color:var(--yi)}
.pb{flex:1}
.pt{font-weight:700;font-size:16.5px;color:var(--hi)}
.pd{font-size:calc(15px*var(--z));color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--dim);margin-top:2px}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--bg2);color:var(--mut);white-space:nowrap;flex:none}
.chip.y{background:var(--y);color:var(--yi)}
details.tips{border:1.5px solid var(--line);border-radius:22px;padding:4px 20px;margin:12px 0}
details.tips summary{min-height:52px;display:flex;align-items:center;font-weight:700;cursor:pointer;list-style:none}
details.tips summary::-webkit-details-marker{display:none}
details.tips summary::after{content:"+";margin-left:auto;color:var(--mut);font-size:22px;font-weight:400}
details.tips[open] summary::after{content:"–"}
details.tips ul{margin:0 0 14px;padding-left:20px;color:var(--ink);font-size:calc(16px*var(--z));line-height:1.7}
.foot{font-size:12.5px;color:var(--dim);margin:22px 0 0}
.pn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--bg2);color:var(--at);font-size:13px;font-weight:700;margin-right:8px;vertical-align:.1em;font-family:"IBM Plex Sans KR",sans-serif;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--y);color:var(--yi);font-weight:700;padding:12px 20px;border-radius:999px;z-index:9;white-space:nowrap;animation:tu .3s ease}
@keyframes tu{from{opacity:0;transform:translate(-50%,10px)}}
.load{font-size:13px;color:var(--dim);margin:-8px 0 14px}
@media (prefers-reduced-motion:reduce){.toast,.ybtn.recing::before{animation:none}.sg,.sw::after{transition:none}}

</style>

<div id="app"></div>
<script>
{
